apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-database
  namespace: data-tier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-database
  namespace: data-tier
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-database
  namespace: data-tier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-database
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: data-tier
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: store-rs
  namespace: data-tier
spec:
  members: 3
  type: ReplicaSet
  version: "8.0.4"
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: store_admin
      db: admin
      passwordSecretRef:
        name: mongodb-secret
        key: root-password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: store-admin-scram
    - name: store_reviews_app
      db: admin
      passwordSecretRef:
        name: mongodb-secret
        key: app-password
      roles:
        - name: readWrite
          db: store_reviews
      scramCredentialsSecretName: store-reviews-app-scram
  statefulSet:
    spec:
      template:
        spec:
          serviceAccountName: mongodb-database
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fix-volume-permissions
              image: busybox:1.37
              command: ["sh", "-c", "chown -R 2000:2000 /data /var/log/mongodb-mms-automation"]
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - FOWNER
                    - DAC_OVERRIDE
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              volumeMounts:
                - name: data-volume
                  mountPath: /data
                - name: logs-volume
                  mountPath: /var/log/mongodb-mms-automation
            - name: mongod-posthook
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile:
                  type: RuntimeDefault
            - name: mongodb-agent-readinessprobe
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile:
                  type: RuntimeDefault
            - name: mongodb-agent
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile:
                  type: RuntimeDefault
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: store-replicated
            resources:
              requests:
                storage: 2Gi
        - metadata:
            name: logs-volume
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: store-replicated
            resources:
              requests:
                storage: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-reviews-init
  namespace: data-tier
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: init
          image: mongo:8
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-password
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              URI="mongodb://store_admin:${MONGO_ROOT_PASSWORD}@store-rs-0.store-rs-svc.data-tier.svc.cluster.local:27017,store-rs-1.store-rs-svc.data-tier.svc.cluster.local:27017,store-rs-2.store-rs-svc.data-tier.svc.cluster.local:27017/store_reviews?replicaSet=store-rs&authSource=admin"
              echo "waiting for store-rs primary"
              for attempt in $(seq 1 60); do
                if mongosh "${URI}" --quiet --eval 'quit(db.hello().isWritablePrimary === true ? 0 : 1)'; then
                  break
                fi
                if [ "${attempt}" -eq 60 ]; then
                  echo "store-rs primary was not elected in time"
                  exit 1
                fi
                sleep 5
              done
              mongosh "${URI}" --quiet --eval '
                const reviews = db.getSiblingDB("store_reviews").product_reviews;
                reviews.createIndex({ sku: 1, createdAt: -1 });
                reviews.updateOne(
                  { sampleId: "sample-st-001" },
                  {
                    $setOnInsert: {
                      sampleId: "sample-st-001",
                      sku: "ST-001",
                      reviewer: "Alex",
                      rating: 5,
                      comment: "Sturdy and convenient for grocery shopping.",
                      createdAt: new Date("2025-01-15T12:00:00.000Z"),
                    },
                  },
                  { upsert: true },
                );
                reviews.updateOne(
                  { sampleId: "sample-st-003" },
                  {
                    $setOnInsert: {
                      sampleId: "sample-st-003",
                      sku: "ST-003",
                      reviewer: "Sam",
                      rating: 4,
                      comment: "A comfortable everyday mug.",
                      createdAt: new Date("2025-01-16T12:00:00.000Z"),
                    },
                  },
                  { upsert: true },
                );
                reviews.createIndex({ sampleId: 1 }, { unique: true, sparse: true });
              '
              echo "product reviews initialized"
