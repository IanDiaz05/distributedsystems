apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mongodb
  namespace: platform-system
spec:
  interval: 1h
  url: https://mongodb.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: community-operator
  namespace: platform-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: platform-system
  chart:
    spec:
      chart: community-operator
      version: "0.13.0"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: platform-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    operator:
      watchNamespace: "*"
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    community-operator-crds:
      enabled: true
    createResource: false
