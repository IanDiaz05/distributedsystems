# RedisFailover CRD for Spotahome redis-operator chart 3.3.0.
# The chart's crds/ YAML embeds Helm templates ({{- with .Values.crds.annotations }})
# which Flux helm-controller v2.10.1 cannot parse. The fully expanded upstream
# OpenAPI schema is also larger than the 256KiB kubectl last-applied annotation
# limit, so this CRD keeps the upstream GVK/names and a structural schema with
# unknown-field preservation (the operator still consumes the full spec).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisfailovers.databases.spotahome.com
  labels:
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/part-of: redis-operator
spec:
  group: databases.spotahome.com
  names:
    kind: RedisFailover
    listKind: RedisFailoverList
    plural: redisfailovers
    shortNames:
      - rf
    singular: redisfailover
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - jsonPath: .metadata.name
          name: NAME
          type: string
        - jsonPath: .spec.redis.replicas
          name: REDIS
          type: integer
        - jsonPath: .spec.sentinel.replicas
          name: SENTINELS
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
