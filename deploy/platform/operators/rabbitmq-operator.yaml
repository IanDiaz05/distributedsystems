# Bitnami's HTTP index (https://charts.bitnami.com/bitnami) still resolves, but
# rabbitmq-cluster-operator 4.4.34 is published as OCI only
# (oci://registry-1.docker.io/bitnamicharts/rabbitmq-cluster-operator).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: platform-system
spec:
  interval: 24h
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq-cluster-operator
  namespace: platform-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: platform-system
  chart:
    spec:
      chart: rabbitmq-cluster-operator
      version: "4.4.34"
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: platform-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    clusterOperator:
      watchAllNamespaces: true
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    # Cluster Operator CRDs are enough for Phase 2A; skip the extra topology operator.
    msgTopologyOperator:
      enabled: false
