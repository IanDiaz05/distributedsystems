apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  address: https://github.com/IanDiaz05/distributedsystems
  secretRef:
    name: github-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-commit-status
  namespace: flux-system
spec:
  providerRef:
    name: github
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: platform-operators
    - kind: Kustomization
      name: platform-data-tier
    - kind: Kustomization
      name: platform-rabbitmq
    - kind: Kustomization
      name: store-apps
