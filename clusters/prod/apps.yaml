apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: store-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/overlays/prod
  prune: true
  wait: true
  dependsOn:
    - name: platform-data-tier
    - name: platform-rabbitmq
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
