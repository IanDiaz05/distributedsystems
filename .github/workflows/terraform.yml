name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init and validate (dev)
        run: |
          terraform -chdir=infra/terraform/envs/dev init -backend=false
          terraform -chdir=infra/terraform/envs/dev validate

      - name: Terraform init and validate (prod)
        run: |
          terraform -chdir=infra/terraform/envs/prod init -backend=false
          terraform -chdir=infra/terraform/envs/prod validate

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        run: |
          pip install --quiet checkov
          checkov -d infra/terraform --framework terraform --quiet
