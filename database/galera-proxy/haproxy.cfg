global
    log stdout format raw local0
    maxconn 120
    external-check preserve-env
    insecure-fork-wanted

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 5s
    timeout queue 3s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend sql
    bind :3306
    default_backend galera

backend galera
    # Both reads and writes use a preferred healthy node. Do not split SQL by text.
    balance first
    option external-check
    external-check path /usr/local/bin:/usr/bin:/bin
    external-check command /usr/local/bin/check-galera.sh
    default-server inter 3s fall 2 rise 2 maxconn 100 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server galera1 galera1:3306 id 1 check on-marked-up shutdown-backup-sessions
    server galera2 galera2:3306 id 2 check backup
    server galera3 galera3:3306 id 3 check backup
